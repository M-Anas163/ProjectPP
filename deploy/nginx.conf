worker_processes auto;

events {
    worker_connections 4096;
}

http {
    log_format upstream_timing
        '$remote_addr "$request" $status '
        'upstream=$upstream_addr upstream_status=$upstream_status '
        'request_time=$request_time connect_time=$upstream_connect_time '
        'header_time=$upstream_header_time response_time=$upstream_response_time';

    access_log logs/access.log upstream_timing;
    error_log logs/error.log warn;

    upstream identity_system {
        server 127.0.0.1:9001 max_fails=3 fail_timeout=10s;
        keepalive 8;
    }

    upstream catalog_system {
        server 127.0.0.1:9002 max_fails=3 fail_timeout=10s;
        keepalive 8;
    }

    upstream finance_system {
        zone finance_system 64k;
        least_conn;
        server 127.0.0.1:9003 max_conns=100 max_fails=3 fail_timeout=5s;
        server 127.0.0.1:9005 max_conns=100 max_fails=3 fail_timeout=5s;
        keepalive 32;
    }

    upstream observability_system {
        server 127.0.0.1:9004 max_fails=3 fail_timeout=10s;
        keepalive 8;
    }

    server {
        listen 8080;
        server_name localhost;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 2s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        add_header X-Upstream-Address $upstream_addr always;
        add_header X-Upstream-Status $upstream_status always;

        location /users {
            proxy_pass http://identity_system;
        }

        location /products {
            proxy_pass http://catalog_system;
        }

        location ~ ^/(inventory|orders|payments|invoices|jobs|reports)(/|$) {
            proxy_pass http://finance_system;
        }

        location /ops {
            proxy_pass http://observability_system;
        }

        location / {
            return 200 "E-Commerce distributed gateway\n";
        }
    }
}
